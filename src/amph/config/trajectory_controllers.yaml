amph:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100

  joint_trajectory_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - Front_Left_Side_joint
      - Front_Left_Thigh_joint
      - Front_Left_Calf_joint
      - Front_Right_Side_joint
      - Front_Right_Thigh_joint
      - Front_Right_Calf_joint
      - Hind_Left_Side_joint
      - Hind_Left_Thigh_joint
      - Hind_Left_Calf_joint
      - Hind_Right_Side_joint
      - Hind_Right_Thigh_joint
      - Hind_Right_Calf_joint

  gazebo_ros_control:
    pid_gains:
      Front_Left_Side_joint:  {p: 100.0, i: 0.01, d: 10.0}
      Front_Left_Thigh_joint: {p: 100.0, i: 0.01, d: 10.0}
      Front_Left_Calf_joint:  {p: 100.0, i: 0.01, d: 10.0}
      Front_Right_Side_joint:  {p: 100.0, i: 0.01, d: 10.0}
      Front_Right_Thigh_joint: {p: 100.0, i: 0.01, d: 10.0}
      Front_Right_Calf_joint:  {p: 100.0, i: 0.01, d: 10.0}
      Hind_Left_Side_joint:  {p: 100.0, i: 0.01, d: 10.0}
      Hind_Left_Thigh_joint: {p: 100.0, i: 0.01, d: 10.0}
      Hind_Left_Calf_joint:  {p: 100.0, i: 0.01, d: 10.0}
      Hind_Right_Side_joint:  {p: 100.0, i: 0.01, d: 10.0}
      Hind_Right_Thigh_joint: {p: 100.0, i: 0.01, d: 10.0}
      Hind_Right_Calf_joint:  {p: 100.0, i: 0.01, d: 10.0}
